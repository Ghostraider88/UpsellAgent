[project]
name = "upsellagent-backend"
version = "0.1.0"
description = "Org-Intelligence & ICP-Matching backend for sales upsell prospecting"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "arq>=0.26",
    "httpx>=0.27",
    "anthropic>=0.40",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP042"]  # B008: FastAPI Depends; UP042: keep (str, Enum)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # readability of inline fixtures over line length
"alembic/*" = ["E402"]  # imports after config by design
